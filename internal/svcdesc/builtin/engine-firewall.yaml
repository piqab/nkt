# Built-in parser iptables, ufw, firewalld (Go). Parsing is in nkt; the description sets
# the priority of its files and lets a description with the same name on
# the host or in a profile override its paths or turn it off:
#
#   name: firewall
#   engine: firewall
#
#   name: firewall
#   disabled: true
name: firewall
title: iptables, ufw, firewalld
engine: firewall
priority: 100
