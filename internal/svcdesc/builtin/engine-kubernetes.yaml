# Built-in parser Kubernetes (Go). Parsing is in nkt; the description sets
# the priority of its files and lets a description with the same name on
# the host or in a profile override its paths or turn it off:
#
#   name: kubernetes
#   engine: kubernetes
#
#   name: kubernetes
#   disabled: true
name: kubernetes
title: Kubernetes
engine: kubernetes
priority: 100
