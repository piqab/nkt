# Built-in parser Caddy (Go). Parsing is in nkt; the description sets
# the priority of its files and lets a description with the same name on
# the host or in a profile override its paths or turn it off:
#
#   name: caddy
#   engine: caddy
#   options:
#     main_config: /etc/caddy/Caddyfile  # NKT_CADDY_MAIN_CONFIG
#
#   name: caddy
#   disabled: true
name: caddy
title: Caddy
engine: caddy
priority: 100
