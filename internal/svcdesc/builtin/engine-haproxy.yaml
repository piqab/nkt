# Built-in parser HAProxy (Go). Parsing is in nkt; the description sets
# the priority of its files and lets a description with the same name on
# the host or in a profile override its paths or turn it off:
#
#   name: haproxy
#   engine: haproxy
#   options:
#     main_config: /etc/haproxy/haproxy.cfg  # NKT_HAPROXY_MAIN_CONFIG
#
#   name: haproxy
#   disabled: true
name: haproxy
title: HAProxy
engine: haproxy
priority: 100
