# Built-in parser nginx (Go). Parsing is in nkt; the description sets
# the priority of its files and lets a description with the same name on
# the host or in a profile override its paths or turn it off:
#
#   name: nginx
#   engine: nginx
#   options:
#     main_config: /etc/nginx/nginx.conf  # NKT_NGINX_MAIN_CONFIG
#
#   name: nginx
#   disabled: true
name: nginx
title: nginx
engine: nginx
priority: 100
