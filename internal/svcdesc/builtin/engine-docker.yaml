# Built-in parser Docker (Go). Parsing is in nkt; the description sets
# the priority of its files and lets a description with the same name on
# the host or in a profile override its paths or turn it off:
#
#   name: docker
#   engine: docker
#   options:
#     compose_files: /srv/docker/docker-compose.yml,/opt/stacks/docker-compose.yml  # NKT_COMPOSE_FILES
#
#   name: docker
#   disabled: true
name: docker
title: Docker
engine: docker
priority: 100
