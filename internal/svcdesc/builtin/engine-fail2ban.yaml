# Built-in parser fail2ban (Go). Parsing is in nkt; the description sets
# the priority of its files and lets a description with the same name on
# the host or in a profile override its paths or turn it off:
#
#   name: fail2ban
#   engine: fail2ban
#   options:
#     root: /etc/fail2ban  # NKT_FAIL2BAN_ROOT
#
#   name: fail2ban
#   disabled: true
name: fail2ban
title: fail2ban
engine: fail2ban
priority: 100
