# Built-in parser Podman (Go). Parsing is in nkt; the description sets
# the priority of its files and lets a description with the same name on
# the host or in a profile override its paths or turn it off:
#
#   name: podman
#   engine: podman
#
#   name: podman
#   disabled: true
name: podman
title: Podman
engine: podman
priority: 100
