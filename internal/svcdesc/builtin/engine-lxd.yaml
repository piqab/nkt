# Built-in parser LXD (Go). Parsing is in nkt; the description sets
# the priority of its files and lets a description with the same name on
# the host or in a profile override its paths or turn it off:
#
#   name: lxd
#   engine: lxd
#
#   name: lxd
#   disabled: true
name: lxd
title: LXD
engine: lxd
priority: 100
