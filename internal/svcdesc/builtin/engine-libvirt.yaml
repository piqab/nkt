# Built-in parser libvirt (Go). Parsing is in nkt; the description sets
# the priority of its files and lets a description with the same name on
# the host or in a profile override its paths or turn it off:
#
#   name: libvirt
#   engine: libvirt
#   options:
#     uri: qemu:///system  # NKT_LIBVIRT_URI
#
#   name: libvirt
#   disabled: true
name: libvirt
title: libvirt
engine: libvirt
priority: 100
