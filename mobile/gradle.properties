# Kept small: the build shares the machine with an emulator. Kotlin
# compiles inside the Gradle process (no separate Kotlin daemon), with few
# workers in parallel.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
kotlin.code.style=official
# iOS targets compile only on macOS (Xcode); on Linux they are skipped, the
# CI builds them on a macOS runner.
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.androidSourceSetLayoutVersion=2
