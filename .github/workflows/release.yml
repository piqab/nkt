name: release

# Запускается пушем тега вида v1.6.38 — собирает бинарники nkt под все
# Linux-архитектуры, где приложение реально работает в Local-режиме
# (amd64, arm64, 32-бит ARM с GOARM=6 — те же три цели, что и Makefile/
# internal/hub умеют собирать локально), публикует их как GitHub Release
# с этим тегом, и отдельно — образ хаба (Dockerfile.hub) в GitHub Container
# Registry для docker compose/Kubernetes (deploy/docker-compose.hub.release.yml,
# deploy/k8s/hub.yaml).
#
# Тег должен совпадать с файлом VERSION в репозитории (без ведущего "v" и
# без суффикса "-beta") — это то же число, что hub's own "обновить"
# сравнивает у управляемых хостов, так что релиз и VERSION не должны
# расходиться.
#
# Как выпустить релиз:
#   1. Обновить VERSION (или make bump-version), закоммитить.
#   2. git tag v$(cat VERSION) && git push origin v$(cat VERSION)
#   3. Дальше всё делает этот workflow — вручную собирать/заливать не нужно.
#
# Бета — тот же путь с суффиксом:
#   git tag v$(cat VERSION)-beta && git push origin v$(cat VERSION)-beta
# Отличия: релиз помечен pre-release (хаб предлагает его только с галочкой
# «использовать бета-версии» в «О системе»), бинарник несёт версию
# X.Y.Z-beta, образ хаба публикуется как :X.Y.Z-beta и :beta — :latest
# бета не трогает. Заметки берутся из того же раздела «## vX.Y.Z»
# WHATSNEW.md, что и у стабильного релиза.
on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-beta"

permissions:
  contents: write
  packages: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    # Род релиза решается один раз по тегу и раздаётся остальным заданиям:
    # version — число из VERSION (для бинарника с суффиксом), beta — 'true'
    # для тега с «-beta», notes_tag — под каким заголовком искать раздел
    # в WHATSNEW.md (у беты он тот же, что у стабильного релиза).
    outputs:
      version: ${{ steps.kind.outputs.version }}
      binary_version: ${{ steps.kind.outputs.binary_version }}
      beta: ${{ steps.kind.outputs.beta }}
      notes_tag: ${{ steps.kind.outputs.notes_tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Тег должен совпадать с файлом VERSION
        id: kind
        run: |
          tag="${GITHUB_REF_NAME#v}"
          beta=false
          case "$tag" in
            *-beta) beta=true; tag="${tag%-beta}" ;;
          esac
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::тег $GITHUB_REF_NAME не совпадает с VERSION ($file) — обновите VERSION и перетегируйте"
            exit 1
          fi
          binary="$file"
          if [ "$beta" = true ]; then binary="$file-beta"; fi
          {
            echo "version=$file"
            echo "binary_version=$binary"
            echo "beta=$beta"
            echo "notes_tag=v$file"
          } >> "$GITHUB_OUTPUT"
          echo "версия $file, бета: $beta, бинарник: $binary"

  frontend:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Реестр npm с раннера иногда рвёт соединение (ECONNRESET) —
      # повторяем установку, а не роняем релиз из-за сети.
      - name: Зависимости фронтенда
        working-directory: web
        run: |
          npm config set fetch-retries 5 fetch-retry-mintimeout 20000 fetch-retry-maxtimeout 120000
          for i in 1 2 3 4; do npm ci && break; echo "npm ci не удался, попытка $i"; sleep 20; done
          test -d node_modules/vite
      - run: cd web && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist
          retention-days: 1

  build:
    needs: [check-version, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, arm]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist
      - name: Собрать бинарник (linux/${{ matrix.goarch }})
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          # GOARM=6 — тот же безопасный минимум, что и в Makefile's native-
          # build/internal/hub: работает и на armv6, и на armv7 (armv6 —
          # строгое подмножество набора инструкций armv7). Для amd64/arm64
          # это пустая переменная — go build её просто игнорирует.
          GOARM: ${{ matrix.goarch == 'arm' && '6' || '' }}
        run: |
          mkdir -p dist
          # Бета несёт версию X.Y.Z-beta: так хаб на бете отличает себя
          # от стабильной сборки той же версии (internal/hub/versioncheck.go)
          # и собирает ссылки на свой релиз (releases/download/vX.Y.Z-beta).
          version="${{ needs.check-version.outputs.binary_version }}"
          out="dist/nkt-linux-${{ matrix.goarch }}"
          go build -buildvcs=false -trimpath -ldflags "-s -w -X main.version=$version" -o "$out" ./cmd/nkt
          chmod +x "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: nkt-linux-${{ matrix.goarch }}
          path: dist/nkt-linux-${{ matrix.goarch }}
          retention-days: 1

  # Собирает и публикует образ ХАБА (Dockerfile.hub) в GitHub Container
  # Registry — на него ссылаются deploy/docker-compose.hub.release.yml и
  # deploy/k8s/hub.yaml, чтобы их можно было развернуть без клонирования
  # репозитория. Обычный nkt (Dockerfile) образом не публикуется: local-режим
  # рассчитан на установку прямо на хост (see README), а не на контейнер без
  # доступа к systemd/iptables/docker-сокету хоста.
  docker-hub-image:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Теги образа: стабильный — :X.Y.Z и :latest; бета — :X.Y.Z-beta и
      # :beta. :latest бета не двигает — на него смотрят готовые манифесты.
      - name: Теги образа
        id: version
        run: |
          v="${{ needs.check-version.outputs.binary_version }}"
          repo="ghcr.io/${{ github.repository_owner }}/nkt-hub"
          if [ "${{ needs.check-version.outputs.beta }}" = true ]; then
            channel=beta
          else
            channel=latest
          fi
          {
            echo "value=$v"
            echo "tags=$repo:$v,$repo:$channel"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.hub
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.version.outputs.tags }}

  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    steps:
      # Нужен именно чекаут, а не голый gh: --generate-notes и определение
      # предыдущего тега для диапазона коммитов gh release create делает,
      # шеллясь в git — без .git в рабочей директории он падает с "not a
      # git repository", даже с валидным GH_TOKEN.
      #
      # fetch-depth: 0 — за тегами: описание релиза собирается из разделов
      # WHATSNEW.md, накопившихся с предыдущего тега, а его надо чем-то
      # определить. При depth 1 в клоне нет ни истории, ни тегов.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: nkt-linux-*
          path: dist
          merge-multiple: true
      # Манифесты для «готового образа» приклеиваются к релизу с точной
      # версией вместо :latest — мутабельный тег можно переставить на
      # чужой образ, а том хаба хранит мастер-ключ и секреты хостов.
      # Правятся копии для ассетов, а не файлы в репозитории: там :latest
      # остаётся, чтобы `docker compose pull` продолжал подтягивать
      # свежий образ у тех, кто этого и хочет.
      #
      # Файлы кладутся прямо в dist, без подкаталога: `gh release create
      # dist/*` загружает ассеты по одному и на каталоге падает с «read
      # dist/deploy: is a directory».
      - name: Манифесты с версией релиза
        run: |
          version="${{ needs.check-version.outputs.binary_version }}"
          sed "s|ghcr.io/piqab/nkt-hub:latest|ghcr.io/piqab/nkt-hub:$version|" \
            deploy/docker-compose.hub.release.yml > dist/docker-compose.hub.release.yml
          sed "s|ghcr.io/piqab/nkt-hub:latest|ghcr.io/piqab/nkt-hub:$version|" \
            deploy/k8s/hub.yaml > dist/k8s-hub.yaml
          grep -n "nkt-hub:" dist/docker-compose.hub.release.yml dist/k8s-hub.yaml
      - name: Контрольные суммы
        working-directory: dist
        run: |
          chmod +x nkt-linux-*
          # Манифесты тоже: они лежат рядом с бинарниками и их так же
          # скачивают по ссылке из README.
          sha256sum nkt-linux-* docker-compose.hub.release.yml k8s-hub.yaml > SHA256SUMS
      # Описание релиза — то, что хаб показывает в «О системе», когда видит
      # новую версию (internal/hub/versioncheck.go читает body этого релиза).
      # Поэтому оно должно быть написанным текстом из WHATSNEW.md, а не
      # автосписком коммитов; автосписок остаётся запасным вариантом, чтобы
      # забытый раздел не обернулся релизом с пустым описанием.
      - name: Описание релиза из WHATSNEW.md
        id: notes
        run: |
          # Раздел ищется по стабильному заголовку «## vX.Y.Z» и для беты:
          # отдельных заметок у неё нет, это те же изменения раньше срока.
          notes_tag="${{ needs.check-version.outputs.notes_tag }}"
          # Предыдущий тег — последний стабильный (беты не считаются): и
          # бета, и стабильный релиз описывают всё с прошлого стабильного,
          # так что стабильные заметки полны, даже если часть уже выходила
          # бетой. "|| true": без единого прошлого тега grep выходит с
          # кодом 1, и под bash -e это уронило бы шаг вместо честного "нет".
          prev="$(git tag --list 'v*.*.*' --sort=-v:refname \
            | grep -v -- '-beta$' \
            | awk -v cur="$notes_tag" 'cur != $0' \
            | head -1 || true)"
          echo "предыдущий тег: ${prev:-нет}"
          # Без раздела релиз не выпускается. Раньше здесь был запасной
          # путь на --generate-notes, и он делал ровно то, чего от
          # заметок не ждут: тело релиза превращалось в ссылку «Full
          # Changelog», которую хаб честно показывал вместо текста
          # изменений. Лучше громко упасть на выпуске, чем тихо выдать
          # пользователю ссылку.
          if ! sh scripts/release-notes.sh "$notes_tag" "$prev" > notes.md; then
            echo "::error::в WHATSNEW.md нет раздела для $notes_tag — добавьте его и повторите выпуск"
            exit 1
          fi
          # Английская часть — из WHATSNEW.en.md, после маркера «<!-- en -->»:
          # хаб делит тело релиза по нему и показывает читающему его язык
          # (versioncheck.go, splitReleaseNotes). Файл ведётся с v1.10.61;
          # для более старых тегов раздела нет — описание останется русским.
          if [ -f WHATSNEW.en.md ] && WHATSNEW_FILE=WHATSNEW.en.md sh scripts/release-notes.sh "$notes_tag" "$prev" > notes.en.md 2>/dev/null; then
            printf '\n\n<!-- en -->\n\n' >> notes.md
            cat notes.en.md >> notes.md
          else
            echo "в WHATSNEW.en.md нет раздела для $notes_tag — описание только по-русски"
          fi
          cat notes.md
      - name: Создать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Бета — pre-release: хаб (internal/hub/versioncheck.go) предлагает
          # такие только с включённым бета-каналом.
          extra=""
          if [ "${{ needs.check-version.outputs.beta }}" = true ]; then
            extra="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md $extra
