name: mobile

# The Kotlin Multiplatform app (mobile/): every change is tested and built
# for Android, and the iOS app is compiled on a macOS runner (no signing and
# no publication — that needs an Apple developer account). Also runnable by
# hand from Actions.
#
# VERSION is deliberately not a trigger: it changes with every commit, so
# this (including the macOS job, whose minutes count tenfold) ran on every
# push. A release builds the signed APK in release.yml anyway.
#
# branches — only branch pushes: GitHub ignores the paths filter for tag
# pushes, so every release tag (v1.11.x) started this too.
on:
  push:
    branches: ["**"]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Tests and debug APK
        working-directory: mobile
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest :androidApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nkt-mobile-debug-apk
          path: mobile/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 7

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # mobile/gradle.properties keeps Gradle small for a developer machine
      # that also runs an emulator (1.5 GB heap, Kotlin in-process); linking
      # the Kotlin/Native + Compose iOS framework needs far more. The user
      # gradle.properties overrides the project one — on the CI runner only.
      - name: Gradle memory for Kotlin/Native
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=daemon
          kotlin.daemon.jvmargs=-Xmx3g
          org.gradle.workers.max=3
          EOF
      - name: Generate the Xcode project
        working-directory: mobile/iosApp
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator (unsigned)
        working-directory: mobile/iosApp
        # The full log needs repository admin rights to download; the
        # compiler errors are re-emitted as annotations, which anyone can
        # read on the run page. ARCHS=arm64: the Kotlin framework is built
        # for iosSimulatorArm64 only (the runner is Apple silicon), and a
        # generic simulator destination would also ask for x86_64.
        run: |
          chmod +x ../gradlew
          set -o pipefail
          if ! xcodebuild -project iosApp.xcodeproj -scheme iosApp \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            MARKETING_VERSION="$(tr -d '[:space:]' < ../../VERSION)" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log; then
            grep -E '(^e: |error:|OutOfMemoryError|FAILURE:|What went wrong)' build.log | sort -u | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
