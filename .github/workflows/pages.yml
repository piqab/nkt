# Сайт nkt (site/, VitePress) и каталог плагинов (catalog/) — на GitHub
# Pages репозитория. В настройках репозитория: Settings → Pages → Source:
# GitHub Actions; секрет NKT_CATALOG_KEY — закрытый ключ каталога (PEM,
# openssl genpkey -algorithm ed25519), его открытая часть встроена в nkt.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'examples/**'
      - 'cmd/nkt-catalog/**'
      - 'internal/catalog/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Реестр npm с раннера иногда рвёт соединение (ECONNRESET) —
      # повторяем установку, а не роняем публикацию из-за сети.
      - name: Зависимости
        working-directory: site
        run: |
          npm config set fetch-retries 5 fetch-retry-mintimeout 20000 fetch-retry-maxtimeout 120000
          for i in 1 2 3 4; do npm ci && break; echo "npm ci не удался, попытка $i"; sleep 20; done
          test -d node_modules/vitepress
      - name: Собрать сайт
        working-directory: site
        run: npm run build
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Каталог плагинов: тест каждого плагина на подделках — упавший в
      # каталог не попадает (остальные выходят); версия плагина обязана
      # вырасти, если его файлы изменились (сверка с опубликованным).
      - name: Тесты плагинов
        id: tests
        run: |
          failed=""
          for t in examples/*/deploy/test_plugin.py; do
            key=$(basename "$(dirname "$(dirname "$t")")")
            if ! (cd "$(dirname "$t")" && timeout 600 python3 -I test_plugin.py); then
              echo "::warning::тест плагина $key не прошёл — плагин не попадёт в каталог"
              failed="$failed,$key"
            fi
          done
          echo "failed=${failed#,}" >> "$GITHUB_OUTPUT"
      # Каталог собирается во временном каталоге и попадает в выкладку
      # только подписанным и сверенным со встроенным в nkt ключом. Ошибка
      # каталога видна в процессе (::error), но сайт всё равно выкладывается —
      # хабы при этом остаются на прежней копии каталога.
      - name: Каталог плагинов
        continue-on-error: true
        env:
          NKT_CATALOG_KEY: ${{ secrets.NKT_CATALOG_KEY }}
        run: |
          work=$(mktemp -d)
          curl -fsSL --retry 3 https://piqab.github.io/nkt/catalog/index.json -o "$work/prev-index.json" \
            || { echo "опубликованного каталога ещё нет — сверка версий пропущена"; rm -f "$work/prev-index.json"; }
          go run ./cmd/nkt-catalog build -src examples -out "$work/catalog" -commit "$GITHUB_SHA" -tested \
            -failed "${{ steps.tests.outputs.failed }}" -prev "$work/prev-index.json"
          if [ -z "$NKT_CATALOG_KEY" ]; then
            echo "::warning::нет секрета NKT_CATALOG_KEY — каталог не подписан и не выкладывается"
            exit 0
          fi
          # Причина — в пометке: сообщения nkt-catalog называют тип ключа, но
          # не его содержимое (internal/catalog TestParsePrivateKeyForms).
          if ! why=$(go run ./cmd/nkt-catalog sign -dir "$work/catalog" 2>&1); then
            echo "::error::секрет NKT_CATALOG_KEY не читается как закрытый ключ ed25519 ($(echo "$why" | grep '^nkt-catalog:' | head -1)) — каталог не выложен"
            exit 1
          fi
          # Подпись сходится со встроенным в nkt ключом — иначе хабы
          # каталог не примут, и выкладывать его незачем.
          if ! go run ./cmd/nkt-catalog verify -dir "$work/catalog"; then
            echo "::error::подпись не сходится с ключом, встроенным в nkt (internal/catalog/sign.go) — в секрете другой ключ; каталог не выложен"
            exit 1
          fi
          go run ./cmd/nkt-catalog pack -dir "$work/catalog" -out site/.vitepress/dist/catalog.tar.gz
          mv "$work/catalog" site/.vitepress/dist/catalog
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
