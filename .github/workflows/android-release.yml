name: android-beta-release

# Бета-релиз только Android-приложения — запуск вручную: Actions →
# «android-beta-release» → Run workflow. Собирает и подписывает APK из
# выбранной ветки и выкладывает его GitHub Release'ом с тегом
# android-v<VERSION>-beta, помеченным pre-release. Бинарники nkt, образ хаба
# и узлы n8n здесь не собираются; хабы такой тег не видят — он не
# разбирается как версия nkt (internal/hub/versioncheck.go, pickReleases).
#
# Повторный запуск с той же версией заменяет APK в существующем релизе.
#
# Ключ подписи — те же секреты, что у задания android-apk в release.yml:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Версия и тег
        id: v
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=android-v$v-beta" >> "$GITHUB_OUTPUT"
          echo "версия $v, тег android-v$v-beta"
      - name: Ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::нет ключа подписи: задайте секреты ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (Settings → Secrets and variables → Actions)"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Тесты, сборка и подпись
        working-directory: android
        # Секреты — только через окружение; keystore — во временный файл
        # раннера и удаляется сразу после сборки.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          NKT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NKT_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NKT_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export NKT_ANDROID_KEYSTORE="$RUNNER_TEMP/nkt-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$NKT_ANDROID_KEYSTORE"
          chmod +x ./gradlew
          ./gradlew --no-daemon test assembleRelease -PnktVersionSuffix=-beta
          rm -f "$NKT_ANDROID_KEYSTORE"
          mkdir -p ../dist
          apk="../dist/nkt-android-${{ steps.v.outputs.version }}-beta.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$apk" | head -3
          (cd ../dist && sha256sum nkt-android-*.apk > SHA256SUMS && cat SHA256SUMS)
      - name: Описание релиза
        run: |
          v="${{ steps.v.outputs.version }}"
          cat > notes.md <<EOF
          **Бета-версия Android-приложения NetKnownsThat ${v}.** Приложение управляет
          настоящими хостами (сервисы, конфигурация, firewall) и ещё обкатывается —
          проверяйте, что делаете, особенно на боевых машинах.

          Установка: скачайте \`nkt-android-${v}-beta.apk\` на телефон и откройте его;
          Android попросит разрешить установку из этого источника. Следующие беты и
          релизы встают поверх — вход и настройки сохраняются. Нужен Android 8+ и хаб
          nkt той же или более новой версии. Сумма — в \`SHA256SUMS\`.

          Справка: https://piqab.github.io/nkt/guide/android ·
          что нового: [WHATSNEW.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/WHATSNEW.md)

          ---

          **Beta of the NetKnownsThat Android app ${v}.** The app manages real hosts
          (services, configuration, firewall) and is still being tried out — double-check
          what you do, especially on production machines.

          Install: download \`nkt-android-${v}-beta.apk\` on the phone and open it; Android
          asks to allow installs from that source. Later betas and releases install over
          it — sign-in and settings are kept. Android 8+ and an nkt hub of the same or a
          newer version are required. Checksum in \`SHA256SUMS\`.

          Docs: https://piqab.github.io/nkt/en/guide/android ·
          what's new: [WHATSNEW.en.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/WHATSNEW.en.md)
          EOF
          cat notes.md
      - name: Релиз (pre-release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.v.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Та же версия собрана ещё раз — заменить файлы и описание.
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --prerelease --notes-file notes.md
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --prerelease \
              --title "Android-приложение ${{ steps.v.outputs.version }} (beta)" \
              --notes-file notes.md
          fi
