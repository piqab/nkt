# Сборка hello-app в GitLab CI и выкладка через хаб nkt.
#
# push в main  → тесты → образ $CI_REGISTRY_IMAGE:<короткий коммит>
# тег v1.2.3   → тесты → образ $CI_REGISTRY_IMAGE:v1.2.3
# затем — вебхук конвейера хаба с этим тегом (подпись nkt, scripts/nkt-hook.sh).
#
# Переменные проекта (Settings → CI/CD → Variables, Masked и Protected):
#   NKT_HOOK_URL     адрес вебхука из окна «Вебхук» конвейера
#   NKT_HOOK_SECRET  секрет подписи оттуда же
# Без NKT_HOOK_URL шаг выкладки не запускается.
#
# Образ — во встроенном registry GitLab; кластеру или хосту нужен доступ
# к нему (Deploy token с read_registry) или публичный проект.

stages: [test, build, deploy]

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v/

test:
  stage: test
  image: python:3.12-slim
  script:
    - python -m unittest -v test_app

build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then TAG="$CI_COMMIT_TAG"; else TAG="$(echo "$CI_COMMIT_SHA" | cut -c1-12)"; fi
      echo "TAG=$TAG" > build.env
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --build-arg VERSION="$TAG" -t "$CI_REGISTRY_IMAGE:$TAG" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG"
  artifacts:
    reports:
      dotenv: build.env

deploy:
  stage: deploy
  image: alpine:3.20
  needs: [build]
  rules:
    - if: $NKT_HOOK_URL
  script:
    - apk add --no-cache curl openssl
    # Ветка конвейера и тег образа; коммит — тот, что собран.
    - sh scripts/nkt-hook.sh "$TAG" "$CI_COMMIT_SHA" main
