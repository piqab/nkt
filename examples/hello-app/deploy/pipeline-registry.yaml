# Вариант 4 — без вебхука: хаб сам следит за тегами образа в registry и
# выкладывает новый тег-версию (v1.2.3). CI только собирает и пушит образ
# по тегу репозитория — секретов хаба в CI нет. Открывать хаб наружу не нужно.
# Выкладка — манифестом (как вариант 1); закрытый registry — логин:токен
# в «Доступе» конвейера. Слежение начинается после первой выкладки кнопкой.
repo: https://github.com/OWNER/hello-app.git
ref: main
action: manifest
manifests:
  - deploy/k8s.yaml
clusters: [prod]
registry: ghcr.io/owner/hello-app      # владелец — в нижнем регистре
registry_tags: '^v\d+\.\d+\.\d+$'
registry_poll: 5m
