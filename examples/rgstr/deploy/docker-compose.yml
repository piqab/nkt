# WARNING: пример использует сторонний репозиторий и образы — их безопасность и стабильность работы не гарантируются.
# WARNING: this example uses a third-party repository and images — their security and stability are not guaranteed.
# rgstr — реестр образов OCI/Docker (github.com/piqab/rgstr) для выкладки
# через хаб nkt: секреты и адрес — из .env конвейера, версия закреплена.
# Вход включён; первый администратор — с временным паролем из .env:
# сменить его при первом входе в /ui, потом — пароль плагину rgstr.
services:
  rgstr:
    image: ghcr.io/piqab/rgstr:1.10.1
    restart: unless-stopped
    environment:
      RGSTR_STORAGE: /data
      RGSTR_AUTH_ENABLED: "true"
      RGSTR_AUTH_SECRET: ${RGSTR_AUTH_SECRET}
      # Адрес выдачи токенов docker login — тот, что видят клиенты.
      RGSTR_AUTH_REALM: https://${RGSTR_DOMAIN}/v2/auth
      RGSTR_ADMIN_USER: ${RGSTR_ADMIN_USER}
      RGSTR_ADMIN_PASSWORD: ${RGSTR_ADMIN_PASSWORD}
      # Удалять — только администратору (без списка могут все пользователи).
      RGSTR_ADMINS: ${RGSTR_ADMIN_USER}
      RGSTR_GC_INTERVAL: 1h
      # Сканирование уязвимостей (Trivy есть в образе): при push и раз в
      # сутки; база Trivy (~70 МБ) качается из интернета (mirror.gcr.io,
      # запасной — ghcr.io) при первом скане и лежит в томе. Скан берёт несколько сотен МБ памяти — false выключает.
      RGSTR_SCAN_ENABLED: ${RGSTR_SCAN_ENABLED:-true}
      # Проекты-кеши других реестров: dockerhub=https://registry-1.docker.io,ghcr=https://ghcr.io
      # (docker pull <домен>/dockerhub/library/nginx). Логин Docker Hub —
      # выше лимиты pull; пароль — токен доступа, в «Секреты» → «.env».
      RGSTR_PROXIES: ${RGSTR_PROXIES:-}
      RGSTR_PROXY_DOCKERHUB_USERNAME: ${RGSTR_PROXY_DOCKERHUB_USERNAME:-}
      RGSTR_PROXY_DOCKERHUB_PASSWORD: ${RGSTR_PROXY_DOCKERHUB_PASSWORD:-}
      # Бэкапы по расписанию в S3 (s3://бакет/префикс); пусто — выключены.
      RGSTR_BACKUP_TARGET: ${RGSTR_BACKUP_TARGET:-}
      RGSTR_BACKUP_SCHEDULE: ${RGSTR_BACKUP_SCHEDULE:-0 3 * * *}
      RGSTR_BACKUP_KEEP: ${RGSTR_BACKUP_KEEP:-7}
      RGSTR_BACKUP_S3_ENDPOINT: ${RGSTR_BACKUP_S3_ENDPOINT:-}
      RGSTR_BACKUP_S3_REGION: ${RGSTR_BACKUP_S3_REGION:-}
      RGSTR_BACKUP_S3_ACCESS_KEY: ${RGSTR_BACKUP_S3_ACCESS_KEY:-}
      RGSTR_BACKUP_S3_SECRET_KEY: ${RGSTR_BACKUP_S3_SECRET_KEY:-}
    volumes:
      - rgstr-data:/data
    # Наружу — только через сайт (HTTPS); порт — на 127.0.0.1 хоста, где его
    # видит и плагин rgstr.
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  rgstr-data:
