# WARNING: пример использует сторонний репозиторий и образы — их безопасность и стабильность работы не гарантируются.
# WARNING: this example uses a third-party repository and images — their security and stability are not guaranteed.
# Конвейер «Выкладок» хаба nkt: umami (веб-аналитика) с PostgreSQL прямо из
# репозитория проекта — compose-файл их, секреты — из .env конвейера.
repo: https://github.com/umami-software/umami.git
ref: master

action: compose
compose:
  file: docker-compose.yml
  project: umami
  hosts: [web1]
  wait_timeout: 5m            # первый старт с миграциями базы — не мгновенный
  # В compose-файле umami секреты записаны значениями — берём их из .env:
  env_keys:
    umami: [APP_SECRET, TWO_FACTOR_ENCRYPTION_KEY, DATABASE_URL]
    db: [POSTGRES_PASSWORD]
  # Порт на хосте вместо того, что в compose-файле (хост:контейнер; адрес —
  # 127.0.0.1 — наружу только через прокси сайта). Занят — возьмите другой:
  # ports:
  #   umami: ["127.0.0.1:13000:3000"]
  # .env стека прямо здесь: при сохранении значения уйдут в секреты
  # конвейера (в описании останется "@secret"), generate: — значение
  # создаст хаб. Посмотреть — «Секреты» → «.env» → история → «Показать».
  env:
    APP_SECRET: generate:hex32
    TWO_FACTOR_ENCRYPTION_KEY: generate:hex32
    POSTGRES_PASSWORD: generate:password
    DATABASE_URL: postgresql://umami:${POSTGRES_PASSWORD}@db:5432/umami
  site:
    domains: [stats.example.com]
    service: umami
    port: 3000
  # Версия закреплена: в файле umami — latest; новая — правкой строки.
  images:
    umami: ghcr.io/umami-software/umami:3.4.0
