# WARNING: пример использует сторонний репозиторий и образы — их безопасность и стабильность работы не гарантируются.
# WARNING: this example uses a third-party repository and images — their security and stability are not guaranteed.
# Authorizer v2 (https://github.com/authorizerdev/authorizer) + PostgreSQL
# для выкладки через хаб nkt. Свой файл, а не compose из их репозитория:
# там build: . (сборка из исходников) и env_file, а v2 переменные окружения
# не читает — все настройки только флагами запуска. Флаги здесь
# подставляются из .env конвейера («Доступ» → «.env стека»).
# Секреты во флагах видны на хосте в `docker inspect` и `ps` — так
# устроен сам authorizer v2.
services:
  authorizer:
    # Версия закреплена; новая — правкой тега.
    image: lakhansamani/authorizer:2.4.2
    restart: unless-stopped
    command:
      - --database-type=postgres
      - --database-url=postgres://authorizer:${POSTGRES_PASSWORD}@db:5432/authorizer?sslmode=disable
      - --url=https://${AUTH_DOMAIN}
      - --client-id=${CLIENT_ID}
      - --client-secret=${CLIENT_SECRET}
      - --admin-secret=${ADMIN_SECRET}
      - --jwt-type=HS256
      - --jwt-secret=${JWT_SECRET}
      # Отдельный ключ шифрования (TOTP): без него — jwt-secret, и смена
      # jwt-secret заперла бы всех с TOTP.
      - --encryption-key=${ENCRYPTION_KEY}
      - --allowed-origins=${ALLOWED_ORIGINS}
      - --log-level=info
      # Регистрацию открывает любой, кто дошёл до страницы входа; если
      # пользователей заводит только администратор — раскомментируйте:
      # - --enable-signup=false
    environment:
      # Без этого журнал начинается со списка всех маршрутов (отладка GIN).
      GIN_MODE: release
    # 8080 — HTTP (API, вход, панель): наружу его опубликует сайт на
    # 127.0.0.1. gRPC 9091 (без TLS) и метрики 8081 не публикуются.
    expose: ["8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: authorizer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: authorizer
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authorizer -d authorizer"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  db-data:
