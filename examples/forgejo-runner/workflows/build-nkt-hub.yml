# Сборка образа хаба nkt на своём раннере: зеркало github.com/piqab/nkt в
# Forgejo («Новая миграция» → зеркало), этот файл — в нём как
# .forgejo/workflows/hub.yml. Тег v1.2.3 → образ
# <registry>/<владелец>/nkt-hub:v1.2.3 в registry Forgejo; выкладку
# делает хаб сам, опросом registry (способ 2, без секретов хаба в CI) —
# конвейер в README.md.
#
# Переменные: REGISTRY (git.example.com). Секреты: REGISTRY_TOKEN
# (write:package).
name: nkt-hub
on:
  push:
    tags: ["v*"]

jobs:
  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка и отправка
        run: |
          image="${{ vars.REGISTRY }}/$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')/nkt-hub"
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "${{ vars.REGISTRY }}" -u "${{ github.actor }}" --password-stdin
          docker build -f Dockerfile.hub --build-arg VERSION="${GITHUB_REF_NAME#v}" -t "$image:${GITHUB_REF_NAME}" .
          docker push "$image:${GITHUB_REF_NAME}"
