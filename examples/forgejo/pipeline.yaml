# WARNING: пример использует сторонний репозиторий и образы — их безопасность и стабильность работы не гарантируются.
# WARNING: this example uses a third-party repository and images — their security and stability are not guaranteed.
# Forgejo + PostgreSQL из examples/ репозитория nkt.
repo: https://github.com/piqab/nkt.git
ref: main

action: compose
compose:
  file: examples/forgejo/deploy/docker-compose.yml
  project: forgejo
  hosts: [web1]
  wait_timeout: 5m
  # SSH для git — наружу (bind по умолчанию сделал бы его 127.0.0.1):
  ports:
    forgejo: ["0.0.0.0:2222:2222"]
  # Без этих переменных в .env сухой прогон не пропустит выкладку:
  env_keys:
    forgejo-admin: [FORGEJO_ADMIN_USER, FORGEJO_ADMIN_PASSWORD, FORGEJO_ADMIN_EMAIL]
  # Порт на хосте вместо того, что в compose-файле (хост:контейнер; адрес —
  # 127.0.0.1 — наружу только через прокси сайта). Занят — возьмите другой:
  # ports:
  #   forgejo: ["127.0.0.1:13000:3000"]
  # .env стека прямо здесь: при сохранении значения уйдут в секреты
  # конвейера (в описании останется "@secret"), generate: — значение
  # создаст хаб. Посмотреть — «Секреты» → «.env» → история → «Показать».
  env:
    POSTGRES_PASSWORD: generate:password
    FORGEJO_DOMAIN: git.example.com
    FORGEJO_ROOT_URL: https://git.example.com/
    FORGEJO_ADMIN_USER: gitadmin
    FORGEJO_ADMIN_PASSWORD: generate:password
    FORGEJO_ADMIN_EMAIL: admin@example.com
  site:
    domains: [git.example.com]
    service: forgejo
    port: 3000
