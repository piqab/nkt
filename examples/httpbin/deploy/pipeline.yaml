# Конвейер «Выкладок» хаба nkt: httpbin прямо из репозитория nkt.
# Для своего репозитория замените repo и путь в file.
repo: https://github.com/piqab/nkt.git
ref: main

action: compose
compose:
  file: examples/httpbin/deploy/docker-compose.yml
  project: httpbin
  hosts: [web1]                 # или group: prod; машина хаба — localhost
  wait_timeout: 3m
  # Сайт: хаб после выкладки сам настроит прокси и сертификат (A-запись
  # имени должна указывать на хост):
  # site:
  #   domains: [httpbin.example.com]
  #   service: httpbin
  #   port: 8080

# poll: 1h   # подхватывать правки примера
