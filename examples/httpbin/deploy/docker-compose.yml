# httpbin — сервис для проверки HTTP-клиентов (https://httpbin.org).
# В postmanlabs/httpbin compose собирает образ из исходников (build: .),
# а выкладка nkt берёт только готовые образы — здесь go-httpbin, клон на Go,
# совместимый по API, под amd64 и arm64.
services:
  httpbin:
    # Образ с Docker Hub: в ghcr.io версионные теги go-httpbin кончаются
    # на v2.16.1, а версия закреплена — обновление правкой этой строки.
    image: mccutchen/go-httpbin:2.25.0
    restart: unless-stopped
    # Порт не публикуется: мастер «Сайтов» опубликует 8080 только на
    # 127.0.0.1, и наружу httpbin будет доступен лишь через прокси.
    # Проверить без прокси — раскомментируйте:
    # ports: ["127.0.0.1:8080:8080"]
    expose: ["8080"]
