# WARNING: пример использует сторонний репозиторий и образы — их безопасность и стабильность работы не гарантируются.
# WARNING: this example uses a third-party repository and images — their security and stability are not guaranteed.
# Plausible Community Edition: приложение, PostgreSQL и ClickHouse.
repo: https://github.com/plausible/community-edition.git
ref: v3.2.1

action: compose
compose:
  file: compose.yml
  project: plausible
  hosts: [web1]
  files: [clickhouse/]          # конфиги ClickHouse (малые ресурсы, только IPv4)
  wait_timeout: 10m
  # Пароль PostgreSQL записан в файле значением — берём из .env:
  env_keys:
    plausible_db: [POSTGRES_PASSWORD]
  # Порт на хосте вместо того, что в compose-файле (хост:контейнер; адрес —
  # 127.0.0.1 — наружу только через прокси сайта). Занят — возьмите другой:
  # ports:
  #   plausible: ["127.0.0.1:18000:8000"]
  # .env стека прямо здесь: при сохранении значения уйдут в секреты
  # конвейера (в описании останется "@secret"), generate: — значение
  # создаст хаб. Посмотреть — «Секреты» → «.env» → история → «Показать».
  env:
    BASE_URL: https://plausible.example.com
    SECRET_KEY_BASE: generate:base64-48
    TOTP_VAULT_KEY: generate:base64-32
    POSTGRES_PASSWORD: generate:password
    DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@plausible_db:5432/plausible_db
    DISABLE_REGISTRATION: invite_only
  site:
    domains: [plausible.example.com]
    service: plausible
    port: 8000
