global
    log stdout format raw local0
    maxconn 2048

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    hold valid 10s

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    retries 3

frontend fe_stand
    bind *:8090
    acl is_health path /healthz
    use_backend be_health if is_health
    default_backend be_stand

backend be_stand
    balance roundrobin
    option httpchk GET /
    server app-a app-a:8080 check resolvers docker init-addr none
    server app-b app-b:8080 check resolvers docker init-addr none

backend be_health
    http-request return status 200 content-type text/plain string "ok"

# Панель статистики без пароля — правило admin-interface-open должно сработать.
listen stats
    bind 0.0.0.0:8404
    stats enable
    stats uri /
    stats refresh 5s
