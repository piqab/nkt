# gitleaks (.github/workflows/security.yml): ищет секреты в истории.
# Ниже — заведомо ненастоящее: синтетические ключи снимка хоста для
# режима fixtures и тестовые токены.
[extend]
useDefault = true

[allowlist]
description = "синтетические ключи fixtures и тестовые значения"
paths = [
  '''^fixtures/''',
  '''_test\.go$''',
  # Моды внешних плагинов: ключи, пароли и токены там заведомо
  # ненастоящие. Подавление по отпечатку (.gitleaksignore) привязано к
  # коммиту и номеру строки, поэтому правка файла или переписанная
  # история каждый раз даёт новый отпечаток; маска по пути закрывает
  # всю историю сразу — тем же способом, что и _test.go выше.
  '''(^|/)test_plugin\.py$''',
]
regexTarget = "line"
regexes = [
  # Комментарий в internal/api/server.go: «there is no per-task key: …».
  '''there is no per-task key''',
  # Ключи перевода в интерфейсе (titleKey: 'topology.colK8sIngress') —
  # имя подписи, не секрет; значение — только буквы, цифры, «.» и «_».
  '''titleKey: '[a-zA-Z0-9_.]+''',
]
