global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 4000

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    retries 3

frontend fe_postgres
    bind 10.10.0.2:5432
    default_backend be_postgres

backend be_postgres
    balance roundrobin
    option pgsql-check user haproxy
    server pg1 10.10.0.11:5432 check inter 5s
    server pg2 10.10.0.12:5432 check inter 5s backup

frontend fe_http
    bind *:8090
    mode http
    option httplog
    acl is_static path_beg /static
    use_backend be_static if is_static
    default_backend be_app

backend be_static
    mode http
    balance roundrobin
    server static1 127.0.0.1:8082 check

backend be_app
    mode http
    balance leastconn
    option httpchk GET /healthz
    server app1 127.0.0.1:8080
    server app2 127.0.0.1:8081

listen stats
    bind 0.0.0.0:9001
    mode http
    stats enable
    stats uri /
    stats refresh 10s

frontend fe_https
    bind *:8443 ssl crt /etc/haproxy/certs
    mode http
    default_backend be_app
