name: acme

services:
  app:
    image: ghcr.io/acme/app:1.24.3
    container_name: acme-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379/0
    networks: [backend]
    depends_on: [postgres, redis]

  api:
    image: ghcr.io/acme/api:2.1.0
    container_name: acme-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    networks: [backend]
    depends_on: [postgres]

  redis:
    image: redis:7-alpine
    container_name: acme-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks: [backend]

  postgres:
    image: postgres:16-alpine
    container_name: acme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: app
      POSTGRES_USER: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: acme-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    networks: [backend, monitoring]

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: acme-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    networks: [monitoring]

  minio:
    image: quay.io/minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: acme-minio
    restart: unless-stopped
    command: server /data --console-address ":9002"
    ports:
      - "8443:9000"
      - "127.0.0.1:9002:9002"
    networks: [backend]

volumes:
  pgdata:

networks:
  backend:
    driver: bridge
  monitoring:
    driver: bridge
